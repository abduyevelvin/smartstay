spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5433/booking_db
    username: ${POSTGRES_BOOKING_USER}
    password: ${POSTGRES_BOOKING_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway manages schema, Hibernate just validates
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.smartstay.*"
        # Map the producer's class name (hotel-service) to this service's local record
        spring.json.type.mapping: "com.smartstay.hotel.event.HotelDeletedEvent:com.smartstay.booking.event.HotelDeletedEvent,hotel-deleted:com.smartstay.booking.event.HotelDeletedEvent"

server:
  port: 8083

feign:
  hotel-service:
    url: http://localhost:8082

app:
  internal-secret: ${INTERNAL_SECRET:change_me_internal_secret_dev}
