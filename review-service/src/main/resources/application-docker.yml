# ── Docker profile — overrides application.yml when SPRING_PROFILES_ACTIVE=docker ──
# Hostnames match the docker-compose.yml service names.

spring:
  data:
    mongodb:
      # MONGO_REVIEW_USER / MONGO_REVIEW_PASSWORD are injected by docker-compose.yml.
      # The dedicated review_db user was created by infra/init-mongo.js at first start.
      uri: mongodb://${MONGO_REVIEW_USER}:${MONGO_REVIEW_PASSWORD}@mongodb:27017/review_db?authSource=admin
  kafka:
    bootstrap-servers: kafka:9092

feign:
  booking-service:
    url: http://booking-service:8083
  hotel-service:
    url: http://hotel-service:8082
