spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.smartstay.*"
        spring.json.type.mapping: >
          com.smartstay.booking.event.BookingConfirmedEvent:com.smartstay.notification.event.BookingConfirmedEvent,
          com.smartstay.booking.event.BookingCancelledEvent:com.smartstay.notification.event.BookingCancelledEvent
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8086

notification:
  mail:
    from: ${MAIL_FROM:noreply@smartstay.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
