spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        # ── Auth Service — PUBLIC (no JWT required) ────────────────────────────
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: auth-service-circuit
                fallbackUri: forward:/fallback
          # No JwtAuthenticationFilter — registration, login, refresh are public

        # ── Admin endpoints — PROTECTED, JWT required, ADMIN role enforced ──────
        - id: admin-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: auth-service-circuit
                fallbackUri: forward:/fallback
          # JwtAuthenticationFilter (GlobalFilter) validates Bearer token and forwards X-User-Role

        # ── Hotel Service — PROTECTED ──────────────────────────────────────────
        - id: hotel-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/hotels/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: hotel-service-circuit
                fallbackUri: forward:/fallback
          # JwtAuthenticationFilter (GlobalFilter) validates Bearer token — step 2.3

        # ── Booking Service — PROTECTED ────────────────────────────────────────
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: booking-service-circuit
                fallbackUri: forward:/fallback
          # JwtAuthenticationFilter (GlobalFilter) validates Bearer token — step 2.3

        # ── Review Service — PROTECTED ─────────────────────────────────────────
        - id: review-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: review-service-circuit
                fallbackUri: forward:/fallback
          # JwtAuthenticationFilter (GlobalFilter) validates Bearer token — step 2.3

        # ── AI Assistant Service — PROTECTED ───────────────────────────────────
        - id: ai-assistant-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: Retry
              args:
                retries: 2
                statuses: SERVICE_UNAVAILABLE
                methods: GET        # POST /chat must NOT be retried — it is not idempotent
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: CircuitBreaker
              args:
                name: ai-assistant-service-circuit
                fallbackUri: forward:/fallback
          # JwtAuthenticationFilter (GlobalFilter) validates Bearer token — step 2.3

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

# ── Resilience4j circuit-breaker defaults ─────────────────────────────────────
# Small sliding window so a burst of startup errors doesn't lock the breaker for
# a minute. 5 s open-state means recovery is fast in dev.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      auth-service-circuit:
        base-config: default
      hotel-service-circuit:
        base-config: default
      booking-service-circuit:
        base-config: default
      review-service-circuit:
        base-config: default
      ai-assistant-service-circuit:
        base-config: default
  # AI LLM calls are slow (embedding retry + model inference can take 10-30 s).
  # Override the default 1 s timeLimiter so the circuit breaker does not time out
  # before the AI service has a chance to respond.
  timelimiter:
    instances:
      ai-assistant-service-circuit:
        timeout-duration: 30s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ── JWT public key (RS256) ─────────────────────────────────────────────────────
# Used by JwtAuthenticationFilter (implemented in step 2.3).
# For local dev: copy certs/public.pem → api-gateway/src/main/resources/certs/public.pem
# For Docker: overridden in application-docker.yml via mounted /certs volume
app:
  security:
    public-key-path: classpath:certs/public.pem
    public-paths:
      - /api/v1/auth/**
      - /actuator/**
    # GET-only public paths: browsing hotels, reading reviews, and AI hotel summaries
    # require no login. Write methods (POST/PUT/DELETE) on these paths still require JWT.
    public-get-paths:
      - /api/v1/hotels/**
      - /api/v1/reviews/**
      - /api/v1/ai/hotels/**/summary
